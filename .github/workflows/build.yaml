name: Clone GitLab Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  clone_repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v3

      - name: Clone GitLab repository
        run: git clone https://gitlab.com/yourusername/your-nethunter-builder.git

      - name: List files to verify clone
        run: ls -l your-nethunter-builder
