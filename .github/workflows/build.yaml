name: Clone GitLab Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  clone_repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v3

      - name: Clone GitLab repository
        run: git clone --depth 1 --branch 2026.2 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder.git

      - name: List files to verify clone
        run: ls -l your-nethunter-builder
