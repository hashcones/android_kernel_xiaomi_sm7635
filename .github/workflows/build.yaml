name: Clone GitLab Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  clone_repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Clone GitLab repository
        run: git clone --depth 1 --branch 2026.2 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder.git

      - name: List files to verify clone
        run: ls -l kali-nethunter-kernel-builder

      - name: Upload cloned repo as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-kernel-builder
          path: kali-nethunter-kernel-builder
